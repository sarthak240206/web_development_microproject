<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookVerse Splash Screen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a8a,#7c3aed);overflow:hidden;color:#fff}
body::before,body::after{content:'';position:absolute;border-radius:50%;filter:blur(50px);opacity:.35}
body::before{width:260px;height:260px;background:#60a5fa;top:10%;left:8%}
body::after{width:320px;height:320px;background:#c084fc;bottom:8%;right:10%}
.card{position:relative;z-index:2;padding:60px 70px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.28);text-align:center;animation:fadeIn 1.2s ease}
.logo{font-size:72px;margin-bottom:14px;animation:float 2.5s ease-in-out infinite}
h1{font-size:clamp(2.8rem,8vw,5rem);letter-spacing:2px;font-weight:800;text-shadow:0 8px 20px rgba(0,0,0,.22)}
.sub{margin-top:10px;color:#e0e7ff;font-size:1rem;letter-spacing:3px;text-transform:uppercase}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<script>
setTimeout(function(){window.location.href='login.html';},3000);
</script>
</head>
<body>
<div class="card">
<div class="logo">📚</div>
<h1>BookVerse</h1>
<div class="sub">Enter the world of stories</div>
</div>
</body>
</html>
